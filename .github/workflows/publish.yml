name: Pull NAVA from Hugging Face

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Install Git LFS
        run: |
          git lfs install

      - name: Install Hugging Face Hub
        run: |
          python -m pip install --upgrade huggingface_hub

      - name: Download NAVA from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf auth login --token "$HF_TOKEN"
          hf download navrt/NAVA_AI \
            --repo-type model \
            --local-dir ./hf_download

      - name: Copy downloaded files
        run: |
          rsync -a --exclude='.git/' ./hf_download/ ./

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync NAVA files from Hugging Face"
            git push origin HEAD:main
          fi
