name: Publish NAVA to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Publish NAVA
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          hf auth login --token "$HF_TOKEN"
          hf upload navrt/NAVA_AI . . \
            --repo-type model \
            --exclude ".git/*" \
            --exclude ".github/*"
