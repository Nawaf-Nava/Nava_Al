name: Publish NAVA to Hugging Face

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub

      - name: Authenticate with Hugging Face
        uses: huggingface/hub@v1
        with:
          repo_id: navrt/NAVA_AI
          repo_type: model

      - name: Upload repository
        env:
          HF_REPO_ID: navrt/NAVA_AI
        run: |
          hf upload "$HF_REPO_ID" . . \
            --repo-type model \
            --exclude ".git/*" \
            --exclude ".github/*"
